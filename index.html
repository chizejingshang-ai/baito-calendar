<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>バイト勤務カレンダー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:700px;margin:auto;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}header{padding:18px 4px 12px}h1{font-size:22px;margin:0 0 5px}.sub,.hint{color:#6b7280;font-size:12px}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0000000d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f9fafb;border-radius:12px;padding:12px 5px;text-align:center}.stat b{display:block;font-size:21px;margin:3px}.stat span{font-size:11px;color:#6b7280}.controls{display:flex;justify-content:space-between;align-items:center}.controls button{width:44px}.month{font-size:19px;font-weight:700}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{text-align:center;color:#6b7280;font-size:12px;margin:12px 0 6px}.day{min-height:58px;border:1px solid #e5e7eb;border-radius:11px;background:#fff;padding:6px;text-align:left}.day.empty{border:0;background:transparent}.day.today{outline:2px solid #111827}.day.shift{background:#dcfce7;border-color:#86efac}.num{font-size:13px}.dot{font-size:10px;color:#166534;margin-top:7px;font-weight:700}button{border:0;border-radius:12px;padding:10px 13px;background:#111827;color:#fff;font:inherit}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;align-items:center}input{width:110px;padding:10px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:700px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}.sheet h2{font-size:18px;margin:0 0 8px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}
</style></head><body><div class="app">
<header><h1>📅 バイト勤務カレンダー</h1><div class="sub">2026〜2029年・試作版</div></header>
<div class="card"><div class="stats"><div class="stat"><span>勤務目標</span><b id="goal">228</b><span>回</span></div><div class="stat"><span>勤務済み</span><b id="done">0</b><span>回</span></div><div class="stat"><span>残り</span><b id="remaining">228</b><span>回</span></div></div></div>
<div class="card"><div class="controls"><button class="secondary" id="prev">‹</button><div class="month" id="monthLabel"></div><button class="secondary" id="next">›</button></div>
<div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="calendar" id="calendar"></div></div>
<div class="card"><div class="row"><label>勤務目標</label><input id="goalInput" type="number" min="0" value="228"><button id="saveGoal">保存</button></div><p class="hint">緑の日がシフト。今日より前のシフトは「勤務済み」として自動カウントします。データはこの端末のブラウザに保存されます。</p></div>
</div>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle"></h2><div class="hint">この日のシフトを登録・削除できます。</div><div class="actions"><button id="add">🟢 シフト登録</button><button class="danger" id="remove">削除</button><button class="secondary" id="close">閉じる</button></div></div></div>
<script src="app.js"></script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script>
</body></html>
